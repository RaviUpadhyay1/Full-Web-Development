<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Design</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="product">
            <div class="gallery">
                <img src="images/image1.png" id="productImg">
                <div class="controls">
                    <span class="btn active"></span>
                    <span class="btn"></span>
                    <span class="btn"></span>
                </div>
            </div>
            <div class="details">
                <h1>Casual T shirt</h1>
                <h2>$15.00</h2>
                <h3>30% OFF</h3>
                <p>Wrangler is an Amerian manufacturer of jeans and other clothing items, particuarly workwear</p>
                <form>
                    <div class="select-size">
                        <p>Size</p>
                        <label for="small">
                            <input type="radio" name="size" id="small">
                            <span>S</span>
                        </label>
                        <label for="Medium">
                            <input type="radio" name="size" id="Medium">
                            <span>M</span>
                        </label>
                        <label for="Large">
                            <input type="radio" name="size" id="Large">
                            <span>L</span>
                        </label>
                        <label for="Extra Large">
                            <input type="radio" name="size" id="Extra Large">
                            <span>XL</span>
                        </label>
                        <label for="Double Extra Large">
                            <input type="radio" name="size" id="Double Extra Large">
                            <span>XXL</span>
                        </label>
                    </div>
                    <div class="select-color">
                        <p>Color</p>
                        <label for="Red">
                            <input type="radio" name="color" id="Red">
                            <span class="color-1"></span>
                        </label>
                        <label for="Green">
                            <input type="radio" name="color" id="Green">
                            <span class="color-2"></span>
                        </label>
                        <label for="Blue">
                            <input type="radio" name="color" id="Blue">
                            <span class="color-3"></span>
                        </label>
                        <label for="Pink">
                            <input type="radio" name="color" id="Pink">
                            <span class="color-4"></span>
                        </label>
                    </div>
                    <div class="select-quantity">
                        <p>Quantity</p>
                        <input type="number" name="" id="" value="1">
                    </div>
                    <button>Buy Now</button>
                </form>

            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

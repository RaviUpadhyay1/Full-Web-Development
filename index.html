<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Backdrop Blur Example</title>
  <style>
    /* Background setup */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url('https://picsum.photos/800/600') no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    /* Glass effect box */
    .glass {
      width: 300px;
      padding: 30px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.1); /* Semi-transparent */
      backdrop-filter: blur(10px);       
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <div class="glass">
    <h2>Frosted Glass UI</h2>
    <p>This is using <code>backdrop-filter: blur(10px);</code></p>
  </div>

</body>
</html>
